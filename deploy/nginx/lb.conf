# The load balancer: the one entry point, port 8080. It serves the console, and forwards the API to
# the two backends. The list of backends is in upstream/upstream.conf, which the upgrade steps change
# to take one backend out of rotation (then: nginx -s reload, which lets in-flight requests finish).

include /etc/nginx/upstream/upstream.conf;

server {
    listen 8080;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # X-Request-Id is passed through unchanged; the backend creates one when it is missing
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_connect_timeout 2s;

    # the load balancer's own health, independent of the backends
    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # the live alert stream: no buffering, and a long timeout (the backend ends it when the token expires)
    location = /api/v1/alerts/stream {
        proxy_pass http://backends;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # delivering reports is safe to repeat (a repeated report changes nothing), so a failed attempt
    # may go to the other backend; claim, release and resolve are never retried automatically
    location = /api/v1/reports/batch {
        proxy_pass http://backends;
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_read_timeout 60s;
        client_max_body_size 6m;
    }

    location /api/ {
        proxy_pass http://backends;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_read_timeout 30s;
    }

    location = /health  { proxy_pass http://backends; }
    location = /metrics { proxy_pass http://backends; }

    # everything else is the console
    location / {
        proxy_pass http://console:8080;
    }
}
